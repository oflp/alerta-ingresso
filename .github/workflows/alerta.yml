name: alerta
on:
schedule:
- cron: '*/10 * * * *'
workflow_dispatch:
jobs:
checar:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: 3.12
- run: pip install playwright requests
- run: playwright install --with-deps chromium
- run: python alerta.py
env:
NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
