name: alerta

on:
  schedule:
    - cron: 0,10,20,30,40,50 * * * *
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install requests
      - run: python alerta.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
